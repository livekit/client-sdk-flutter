# Fails a PR that changes the package without a changeset, with a comment
# that links to a prefilled changeset file. The `internal` label skips the
# check. The same run compares the public API against the last pub.dev
# release with dart-apitool (`check.api` in verwalter.toml) and fails when
# a break comes without a `major` changeset.
name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the API check needs the baseline tag
      - uses: ./.github/actions/setup-flutter
      - run: dart pub global activate dart_apitool
      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        with:
          command: check
