# Publishes the tag it runs on to pub.dev. pub.dev accepts trusted
# publishing only from a run on a tag, so release.yaml starts this workflow
# with `--ref <tag>` and waits for it. To re-run by hand, choose the tag
# under "Use workflow from". A version pub.dev already has is skipped.
name: Publish to pub.dev

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tool flips the draft release after the publish
      id-token: write # trusted publishing
    steps:
      # A run from a branch has nothing to publish. Fail it, so a run by
      # hand on the wrong ref is red instead of a green run that did nothing.
      - name: Require a release tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::Run this workflow on a release tag, not on $GITHUB_REF."
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags decide what is published

      # Mints a temporary pub.dev token from the GitHub OIDC token and
      # registers it in the shared pub config used by the publish step.
      - uses: dart-lang/setup-dart@v1

      - uses: ./.github/actions/setup-flutter

      # Runs `dart pub publish --force`. release.yaml validated the package
      # before the tag was created.
      - uses: livekit/verwalter@39e3d7c57c2b6d96cf2d4b7771f3ab199490faba # v0.31.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
