name: livekit_example
description: Example app that uses LiveKit Flutter SDK
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.19.0
  flutter_background: ^1.1.0
  permission_handler: ^11.3.1
  provider: ^6.0.1
  logging: ^1.0.1
  shared_preferences: ^2.0.7
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.5
  dropdown_button2: ^2.3.6
  collection: '>=1.16.0'

  livekit_client:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# The following section is specific to Flutter.
flutter:
  # Swift Package Manager is disabled for the example because this app lives inside the
  # livekit_client plugin it depends on. With SPM enabled, the Flutter tool (>= 3.44) copies
  # the whole plugin directory into build/<platform>/SourcePackages when the plugin's
  # Package.swift depends on another plugin (flutter_webrtc). Since that destination is inside
  # the plugin directory itself, every build copies the previous copy again and the build
  # directory grows without bound. iOS/macOS use CocoaPods instead. CI builds with SPM through
  # FLUTTER_SWIFT_PACKAGE_MANAGER, which takes precedence over this setting.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - images/logo-dark.svg
